<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="100%" stop-color="#7C3AED" />
    </linearGradient>
    <linearGradient id="woolGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F3F4F6" />
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#312E81" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Background Circle -->
  <rect width="160" height="160" rx="36" fill="url(#bgGrad)" filter="url(#softShadow)" />

  <!-- Sheep Ears -->
  <ellipse cx="48" cy="74" rx="14" ry="8" transform="rotate(-20 48 74)" fill="#FCE7F3" stroke="#F472B6" stroke-width="3" />
  <ellipse cx="112" cy="74" rx="14" ry="8" transform="rotate(20 112 74)" fill="#FCE7F3" stroke="#F472B6" stroke-width="3" />

  <!-- Wool Body / Cloud Clusters -->
  <g fill="url(#woolGrad)">
    <circle cx="80" cy="72" r="32" />
    <circle cx="60" cy="80" r="26" />
    <circle cx="100" cy="80" r="26" />
    <circle cx="68" cy="98" r="24" />
    <circle cx="92" cy="98" r="24" />
    <circle cx="80" cy="106" r="22" />
    <!-- Fluffy Head Tuft -->
    <circle cx="80" cy="48" r="14" />
    <circle cx="68" cy="54" r="11" />
    <circle cx="92" cy="54" r="11" />
  </g>

  <!-- Sheep Face -->
  <ellipse cx="80" cy="78" rx="18" ry="16" fill="#FDE8E8" />

  <!-- Eyes -->
  <circle cx="73" cy="74" r="2.5" fill="#1E1B4B" />
  <circle cx="87" cy="74" r="2.5" fill="#1E1B4B" />

  <!-- Cute Rosy Cheeks -->
  <circle cx="68" cy="81" r="3" fill="#F472B6" opacity="0.6" />
  <circle cx="92" cy="81" r="3" fill="#F472B6" opacity="0.6" />

  <!-- Smile -->
  <path d="M 76 83 Q 80 88 84 83" fill="none" stroke="#1E1B4B" stroke-width="2" stroke-linecap="round" />

  <!-- Checkmark Badge Overlay -->
  <circle cx="118" cy="118" r="18" fill="#10B981" stroke="#FFFFFF" stroke-width="3" />
  <path d="M 110 118 L 115 123 L 126 112" fill="none" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
</svg>
